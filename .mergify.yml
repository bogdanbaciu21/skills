queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - label=ready-to-merge
    merge_conditions:
      - label=ready-to-merge

pull_request_rules:
  - name: queue when ready
    conditions:
      - label=ready-to-merge
    actions:
      queue:
        name: default

commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = devin-ai-integration
          - sender = devin-ai-integration[bot]

merge_protections:
  - name: ready label
    if:
      - base=main
    success_conditions:
      - label=ready-to-merge
