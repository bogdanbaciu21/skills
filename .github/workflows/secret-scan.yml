name: secret-scan

# Fail-closed gate: runs skill_secret_scan.py on every push and PR so a live
# credential or a client-confidential marker can never land in this PUBLIC repo
# again. Client-SPECIFIC markers stay OUT of the repo and are injected here from
# the SECRET_SCAN_EXTRA repo secret (set it under Settings -> Secrets -> Actions).
# Fork PRs do not receive the secret, so they still get the generic baseline scan.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for secrets / client-confidential markers
        env:
          SECRET_SCAN_EXTRA: ${{ secrets.SECRET_SCAN_EXTRA }}
        run: |
          python3 .githooks/skill_secret_scan.py \
            agent-coordination agent-research assets blog-image-gen \
            bogdan-baciu-design chat-analysis deep-research-agents excel-wow \
            format-html fpa-analyst grill-me handoff insight-lock \
            parallel-dispatch quiz-me scripts skill-drift-scanner \
            table-system-migration tests weekly-update \
            README.md AGENTS.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md
