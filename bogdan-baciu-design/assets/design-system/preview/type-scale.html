<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 18px 22px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  td { padding: 6px 10px; vertical-align: baseline; border-bottom: 1px dashed var(--rule); }
  td.lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); width: 26%; white-space: nowrap; }
  td.spec { font-family: 'Instrument Serif', serif; font-weight: 400; color: var(--ink); letter-spacing: -0.01em; line-height: 1; }
  td.spec.body { font-family: var(--font-body); font-size: 18px; line-height: 1.55; letter-spacing: 0; }
  td.size { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); white-space: nowrap; text-align: right; width: 22%; }
  tr:last-child td { border-bottom: 0; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="lbl">Name</td>
      <td class="spec" style="font-size: 56px; line-height: 0.92; letter-spacing: -0.03em;">Bogdan</td>
      <td class="size">clamp(56,9vw,168)</td>
    </tr>
    <tr>
      <td class="lbl">Section</td>
      <td class="spec" style="font-size: 36px; letter-spacing: -0.02em;">Recent <em style="color: var(--sky-600);">writing</em></td>
      <td class="size">clamp(48,6vw,96)</td>
    </tr>
    <tr>
      <td class="lbl">Display</td>
      <td class="spec" style="font-size: 30px; letter-spacing: -0.025em;">Work with me</td>
      <td class="size">clamp(46,7vw,110)</td>
    </tr>
    <tr>
      <td class="lbl">Lede</td>
      <td class="spec" style="font-size: 20px; font-style: italic; color: var(--ink-soft); line-height: 1.3;">A short italic lede</td>
      <td class="size">clamp(20,2vw,26)</td>
    </tr>
    <tr>
      <td class="lbl">Body</td>
      <td class="spec body">Geist body, 20px on the live site, 1.78 line-height, 74ch</td>
      <td class="size">20 / 1.78</td>
    </tr>
  </table>
</body>
</html>
