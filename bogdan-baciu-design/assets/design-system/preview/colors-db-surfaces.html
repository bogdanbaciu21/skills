<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>.db-scope — paper cream surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 18px 22px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid #d6cfc1; }
  .sw { aspect-ratio: 1.6 / 1; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #d6cfc1; }
  .sw:last-child { border-right: 0; }
  .sw .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1; }
  .sw .hex { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; opacity: 0.85; line-height: 1; }
  .caption { margin-top: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: #faf7f2; color: #1a2330; outline: 1px solid #d6cfc1; outline-offset: -1px;"><span class="name">Paper</span><span class="hex">#FAF7F2</span></div>
    <div class="sw" style="background: #fffdf8; color: #1a2330; outline: 1px solid #d6cfc1; outline-offset: -1px;"><span class="name">Panel</span><span class="hex">#FFFDF8</span></div>
    <div class="sw" style="background: #f3ede2; color: #1a2330;"><span class="name">Paper edge</span><span class="hex">#F3EDE2</span></div>
    <div class="sw" style="background: #d6cfc1; color: #1a2330;"><span class="name">Rule</span><span class="hex">#D6CFC1</span></div>
    <div class="sw" style="background: #4a5568; color: #fff;"><span class="name">Ink soft</span><span class="hex">#4A5568</span></div>
    <div class="sw" style="background: #1a2330; color: #fff;"><span class="name">Ink</span><span class="hex">#1A2330</span></div>
  </div>
  <div class="caption">Scoped to .db-scope · embedded financial-model artifacts only · don't merge with global</div>
</body>
</html>
