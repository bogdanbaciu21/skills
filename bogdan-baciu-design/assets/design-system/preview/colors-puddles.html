<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puddles — Sky scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 18px 22px; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; border: 1px solid var(--rule); }
  .sw { aspect-ratio: 1.6 / 1; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--rule); position: relative; }
  .sw:last-child { border-right: 0; }
  .sw .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: inherit; line-height: 1; }
  .sw .hex { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: inherit; opacity: 0.85; line-height: 1; }
  .caption { margin-top: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--sky-100); color: var(--ink);"><span class="name">Sky 100</span><span class="hex">#ECF3F7</span></div>
    <div class="sw" style="background: var(--sky-200); color: var(--ink);"><span class="name">Sky 200</span><span class="hex">oklch 0.93</span></div>
    <div class="sw" style="background: var(--sky-300); color: var(--ink);"><span class="name">Sky 300</span><span class="hex">#AACDE0</span></div>
    <div class="sw" style="background: var(--sky-400); color: #fff;"><span class="name">Sky 400</span><span class="hex">oklch 0.78</span></div>
    <div class="sw" style="background: var(--sky-500); color: #fff;"><span class="name">Sky 500</span><span class="hex">oklch 0.65</span></div>
    <div class="sw" style="background: var(--sky-600); color: #fff;"><span class="name">Sky 600</span><span class="hex">#0A6E9A</span></div>
    <div class="sw" style="background: var(--sky-700); color: #fff;"><span class="name">Sky 700</span><span class="hex">#0B4F76</span></div>
    <div class="sw" style="background: var(--sky-900); color: #fff;"><span class="name">Sky 900</span><span class="hex">#152234</span></div>
  </div>
  <div class="caption">600 = primary accent &amp; link · 700 = chrome / footer · 900 = button fill</div>
</body>
</html>
