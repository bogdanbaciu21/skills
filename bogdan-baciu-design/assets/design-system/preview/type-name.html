<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Display name</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--paper); padding: 22px 28px; }
  .specimen { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 96px; line-height: 0.92; letter-spacing: -0.03em; color: var(--ink); margin: 0; }
  .specimen em, .specimen .amp { font-style: italic; color: var(--sky-600); }
  .meta { margin-top: 18px; display: flex; gap: 18px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
  .meta b { color: var(--ink-soft); font-weight: 500; }
</style>
</head>
<body>
  <p class="specimen">Bogdan <em>&amp;</em> Baciu</p>
  <div class="meta">
    <span><b>Family</b> Instrument Serif 400</span>
    <span><b>Size</b> clamp(56,9vw,168)</span>
    <span><b>LH</b> 0.92</span>
    <span><b>Track</b> -0.03em</span>
  </div>
</body>
</html>
